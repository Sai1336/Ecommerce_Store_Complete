
{% extends 'store/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Create your account</h1>
    <p class="muted">Register to start shopping.</p>

    <form method="post">
        {% csrf_token %}

        <!-- Username -->
        <label for="username">Username</label>
        <input
            id="username"
            type="text"
            name="username"
            required
            autocomplete="username"
        >

        <!-- Email -->
        <label for="email">Email address</label>
        <input
            id="email"
            type="email"
            name="email"
            required
            autocomplete="email"
        >

        <!-- Password -->
        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            name="password"
            required
            minlength="8"
            autocomplete="new-password"
        >

        <!-- Confirm password -->
        <label for="confirm_password">Confirm password</label>
        <input
            id="confirm_password"
            type="password"
            name="confirm_password"
            required
            minlength="8"
            autocomplete="new-password"
        >

        <!-- Math CAPTCHA -->
        <div class="captcha-box">
            <label for="captcha_answer">
                Security Check: What is {{ captcha_a }} + {{ captcha_b }}?
            </label>

            <input
                id="captcha_answer"
                type="number"
                name="captcha_answer"
                placeholder="Enter the answer"
                required
                autocomplete="off"
            >
        </div>

        <!-- Submit -->
        <button class="button full" type="submit">
            Create Account
        </button>

    </form>

    <p class="form-bottom">
        Already registered?
        <a href="{% url 'login' %}">Log in</a>
    </p>

</div>

<style>
    .captcha-box {
        margin: 20px 0;
        padding: 16px;
        background: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 8px;
    }

    .captcha-box label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #172033;
    }

    .captcha-box input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 16px;
    }

    .captcha-box input:focus {
        outline: 2px solid #64748b;
        outline-offset: 1px;
    }
</style>

{% endblock %}
